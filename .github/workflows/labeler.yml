name: PR Labeler

on:
    pull_request_target:
        types: [opened, synchronize, reopened]

permissions:
    contents: read
    issues: write
    pull-requests: write

jobs:
    label:
        runs-on: ubuntu-latest
        steps:
            # 通过 GitHub API 读取默认分支配置和 PR 变更文件，不检出 PR 代码。
            - uses: actions/labeler@v7
              with:
                  sync-labels: true
