name: Security Audit

on:
    schedule:
        - cron: '0 0 * * 1' # 周一北京时间 08:00
    workflow_dispatch:

permissions:
    contents: read

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: '26'
            - run: pnpm audit --audit-level=high
