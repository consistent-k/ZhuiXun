packages:
    - 'apps/*'
    - 'packages/*'

allowBuilds:
    core-js: true
    esbuild: false
    electron: true
    unrs-resolver: true
    electron-winstaller: true

minimumReleaseAge: 0

overrides:
    'dompurify@>=3.4.4 <3.4.17': '3.5.0'
    'body-parser@>=2 <2.4.0': '2.4.0'
    'undici@6': '^6.29.1'
    'undici@7': '^8.0.0'
    # bash-tool 仍声明 Zod 3，其工具输入仅使用 Zod 4 兼容的 object/string/describe。
    'bash-tool@1.3.19>zod': '^4.6.7'
    'eslint-plugin-react-hooks@7.1.1>zod': '^4.6.7'
